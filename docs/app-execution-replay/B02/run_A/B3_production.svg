<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 443" role="img" aria-label="오차 기반 평가척도"><title>오차 기반 평가척도</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="443" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">항목 | 특징 | 해석 포인트</text><g data-slot-index="0"><title>MAE | 절대오차 평균, 원래 변수와 같은 단위 | 평균적인 오차크기, 극단적 오차의 영향이 상대적으로 작음</title><rect x="32" y="59" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">MAE | 절대오차 평균, 원래 변수와 같은 단위 | 평균적인 오차크기, 극단적 오차의 </text><text x="46" y="107" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">영향이 상대적으로 작음</text></g><g data-slot-index="1"><title>MSE | 제곱오차 평균 | 큰 오차에 더 큰 벌점을 주어 큰 예측오차에 민감함</title><rect x="32" y="159" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="184" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">MSE | 제곱오차 평균 | 큰 오차에 더 큰 벌점을 주어 큰 예측오차에 민감함</text></g><g data-slot-index="2"><title>RMSE | MSE의 제곱근, 원래 목표변수와 같은 단위 | 원래 단위로 해석하면서 큰 오차에 민감함</title><rect x="32" y="243" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="268" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">RMSE | MSE의 제곱근, 원래 목표변수와 같은 단위 | 원래 단위로 해석하면서 큰 </text><text x="46" y="291" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">오차에 민감함</text></g><g data-slot-index="3"><title>MAPE | 실제값 대비 절대오차 비율의 평균 | 상대오차를 백분율로 해석하되 실제값이 0에 가깝다면 주의함</title><rect x="32" y="343" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="368" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">MAPE | 실제값 대비 절대오차 비율의 평균 | 상대오차를 백분율로 해석하되 실제값이 </text><text x="46" y="391" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">0에 가깝다면 주의함</text></g></svg>