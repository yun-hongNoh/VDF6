<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 395" role="img" aria-label="잔차에서 확인할 패턴"><title>잔차에서 확인할 패턴</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="395" fill="#fff"/><text x="32" y="41" font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" font-size="15" fill="#212528" xml:space="preserve"><tspan>항목 배열</tspan></text><g data-slot-index="0"><title>예측값이 커질수록 잔차의 폭이 커지는지 확인함</title><rect x="32" y="59" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" font-size="15" fill="#212528" xml:space="preserve"><tspan>예측값이 커질수록 잔차의 폭이 커지는지 확인함</tspan></text></g><g data-slot-index="1"><title>곡선형 패턴이 남아 있는지 확인함</title><rect x="32" y="143" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="168" font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" font-size="15" fill="#212528" xml:space="preserve"><tspan>곡선형 패턴이 남아 있는지 확인함</tspan></text></g><g data-slot-index="2"><title>특정 집단에서 오차가 집중되는지 확인함</title><rect x="32" y="227" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="252" font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" font-size="15" fill="#212528" xml:space="preserve"><tspan>특정 집단에서 오차가 집중되는지 확인함</tspan></text></g><g data-slot-index="3"><title>극단적인 잔차가 존재하는지 확인함</title><rect x="32" y="311" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="336" font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" font-size="15" fill="#212528" xml:space="preserve"><tspan>극단적인 잔차가 존재하는지 확인함</tspan></text></g></svg>