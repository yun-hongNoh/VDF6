<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 395" role="img" aria-label="조기지원 대상자 선정을 위한 모형 해석"><title>조기지원 대상자 선정을 위한 모형 해석</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="395" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">항목 배열</text><g data-slot-index="0"><title>모형 A | MAE가 더 작고 RMSE는 모형 B와 비슷함</title><rect x="32" y="59" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">모형 A | MAE가 더 작고 RMSE는 모형 B와 비슷함</text></g><g data-slot-index="1"><title>모형 B | R²가 더 높지만 일부 학생에서 매우 큰 오차가 발생함</title><rect x="32" y="143" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="168" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">모형 B | R²가 더 높지만 일부 학생에서 매우 큰 오차가 발생함</text></g><g data-slot-index="2"><title>평가지표 확인 | MAE·RMSE·R²를 목적에 맞게 함께 해석함</title><rect x="32" y="227" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="252" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">평가지표 확인 | MAE·RMSE·R²를 목적에 맞게 함께 해석함</text></g><g data-slot-index="3"><title>잔차 확인 | 일부 학생의 극단적 오차와 특정 집단의 오차 집중 여부를 확인함</title><rect x="32" y="311" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="336" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">잔차 확인 | 일부 학생의 극단적 오차와 특정 집단의 오차 집중 여부를 확인함</text></g></svg>