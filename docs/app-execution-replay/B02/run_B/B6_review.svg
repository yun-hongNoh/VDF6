<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 395" role="img" aria-label="회귀모형 평가의 주의점"><title>회귀모형 평가의 주의점</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="395" fill="#fff"/><text x="32" y="41" font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" font-size="15" fill="#212528" xml:space="preserve"><tspan>항목 배열</tspan></text><g data-slot-index="0"><title>R²가 높아도 모든 면에서 좋은 모형이라고 단정할 수 없음</title><rect x="32" y="59" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" font-size="15" fill="#212528" xml:space="preserve"><tspan>R²가 높아도 모든 면에서 좋은 모형이라고 단정할 수 없음</tspan></text></g><g data-slot-index="1"><title>R²가 높아도 잔차에 구조적 패턴이 남을 수 있음</title><rect x="32" y="143" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="168" font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" font-size="15" fill="#212528" xml:space="preserve"><tspan>R²가 높아도 잔차에 구조적 패턴이 남을 수 있음</tspan></text></g><g data-slot-index="2"><title>RMSE가 작아도 잔차 확인이 필요함</title><rect x="32" y="227" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="252" font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" font-size="15" fill="#212528" xml:space="preserve"><tspan>RMSE가 작아도 잔차 확인이 필요함</tspan></text></g><g data-slot-index="3"><title>오차척도·설명력·잔차·일반화성능을 함께 봐야 함</title><rect x="32" y="311" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="336" font-family="Noto Sans KR, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" font-size="15" fill="#212528" xml:space="preserve"><tspan>오차척도·설명력·잔차·일반화성능을 함께 봐야 함</tspan></text></g>