<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 259" role="img" aria-label="일반인의 질문과 숙련자의 질문"><title>일반인의 질문과 숙련자의 질문</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="259" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">항목 | A값 | B값</text><g data-slot-index="0"><title>질문 방식 | 일반인: 기발한 새 의자 아이디어 요구 | 숙련자: 일반 사무용 의자에 S와 C 조건을 강제함</title><rect x="32" y="59" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">질문 방식 | 일반인: 기발한 새 의자 아이디어 요구 | 숙련자: 일반 사무용 의자에 </text><text x="46" y="107" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">S와 C 조건을 강제함</text></g><g data-slot-index="1"><title>결과 경향 | 일반인: 메시 소재·인체공학 등 일반적 디자인 | 숙련자: 조건에 맞춘 구체적인 파생 아이디어</title><rect x="32" y="159" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="184" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">결과 경향 | 일반인: 메시 소재·인체공학 등 일반적 디자인 | 숙련자: 조건에 맞춘 </text><text x="46" y="207" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">구체적인 파생 아이디어</text></g></svg>