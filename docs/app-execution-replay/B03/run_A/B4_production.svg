<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 243" role="img" aria-label="대체하기의 질문 프레임"><title>대체하기의 질문 프레임</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="243" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">항목 배열</text><g data-slot-index="0"><title>핵심 질문 | 이것을 대체할 다른 것은 없나?</title><rect x="32" y="59" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">핵심 질문 | 이것을 대체할 다른 것은 없나?</text></g><g data-slot-index="1"><title>세부 질문 | 무엇으로, 누구로, 어떤 재질로, 어떤 다른 방법·소리·장소로 대체할 수 있는가?</title><rect x="32" y="143" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="168" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">세부 질문 | 무엇으로, 누구로, 어떤 재질로, 어떤 다른 방법·소리·장소로 대체할 수 </text><text x="46" y="191" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">있는가?</text></g></svg>