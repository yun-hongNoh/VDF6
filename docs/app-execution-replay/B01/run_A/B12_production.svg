<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 563" role="img" aria-label="빅데이터 활용 사례"><title>빅데이터 활용 사례</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="563" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">항목 배열</text><g data-slot-index="0"><title>고객 분석 | 구매이력과 행동 데이터로 고객 특성과 선호를 파악함</title><rect x="32" y="59" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">고객 분석 | 구매이력과 행동 데이터로 고객 특성과 선호를 파악함</text></g><g data-slot-index="1"><title>추천 서비스 | 이용기록으로 상품·콘텐츠·강의 등을 추천함</title><rect x="32" y="143" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="168" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">추천 서비스 | 이용기록으로 상품·콘텐츠·강의 등을 추천함</text></g><g data-slot-index="2"><title>수요 예측 | 판매량이나 이용량으로 향후 수요를 예측하여 재고와 자원을 계획함</title><rect x="32" y="227" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="252" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">수요 예측 | 판매량이나 이용량으로 향후 수요를 예측하여 재고와 자원을 계획함</text></g><g data-slot-index="3"><title>이상 탐지 | 평소와 다른 거래나 시스템 상태를 탐지하여 위험과 장애에 대응함</title><rect x="32" y="311" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="336" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">이상 탐지 | 평소와 다른 거래나 시스템 상태를 탐지하여 위험과 장애에 대응함</text></g><g data-slot-index="4"><title>공공서비스 | 교통·안전·복지·재난 데이터를 분석하여 정책과 서비스를 개선함</title><rect x="32" y="395" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="420" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">공공서비스 | 교통·안전·복지·재난 데이터를 분석하여 정책과 서비스를 개선함</text></g><g data-slot-index="5"><title>교육 분야 | 접속·출석·과제·성적 데이터로 참여 상태를 파악하고 학습지원을 제공함</title><rect x="32" y="479" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="504" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">교육 분야 | 접속·출석·과제·성적 데이터로 참여 상태를 파악하고 학습지원을 제공함</text></g></svg>