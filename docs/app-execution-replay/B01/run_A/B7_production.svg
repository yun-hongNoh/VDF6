<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 359" role="img" aria-label="데이터의 구조화 유형"><title>데이터의 구조화 유형</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="359" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">대분류 | 하위항목 목록</text><g data-slot-index="0"><title>정형 데이터 | 행과 열 등 일정한 규칙과 구조 / 검색·정렬·집계가 비교적 쉬움 / 거래내역·성적표·고객 DB·재고 데이터</title><rect x="32" y="59" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">정형 데이터 | 행과 열 등 일정한 규칙과 구조 / 검색·정렬·집계가 비교적 쉬움 / </text><text x="46" y="107" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">거래내역·성적표·고객 DB·재고 데이터</text></g><g data-slot-index="1"><title>반정형 데이터 | 고정된 표 구조는 없지만 태그나 키 등 구조정보 포함 / 관계와 항목 구분 가능 / JSON·XML·웹 로그·일부 이벤트 데이터</title><rect x="32" y="159" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="184" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">반정형 데이터 | 고정된 표 구조는 없지만 태그나 키 등 구조정보 포함 / 관계와 항목 </text><text x="46" y="207" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">구분 가능 / JSON·XML·웹 로그·일부 이벤트 데이터</text></g><g data-slot-index="2"><title>비정형 데이터 | 일정한 행과 열 구조로 바로 표현하기 어려움 / 목적에 따른 별도 처리 필요 / 텍스트·이미지·음성·영상·상품평·상담 녹음·SNS 게시물</title><rect x="32" y="259" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="284" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">비정형 데이터 | 일정한 행과 열 구조로 바로 표현하기 어려움 / 목적에 따른 별도 </text><text x="46" y="307" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">처리 필요 / 텍스트·이미지·음성·영상·상품평·상담 녹음·SNS 게시물</text></g></svg>