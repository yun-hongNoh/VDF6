<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="explicit" viewBox="0 0 900 563" role="img" aria-label="데이터에서 가치로의 전환"><title>데이터에서 가치로의 전환</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="563" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">번호 | 명칭 | 설명</text><g data-slot-index="0"><title>1 | 데이터 수집 | 활용 목적에 필요한 데이터를 확보함</title><rect x="32" y="59" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">1 | 데이터 수집 | 활용 목적에 필요한 데이터를 확보함</text></g><g data-slot-index="1"><title>2 | 저장 | 수집한 데이터를 이용 가능한 형태로 보관함</title><rect x="32" y="143" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="168" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">2 | 저장 | 수집한 데이터를 이용 가능한 형태로 보관함</text></g><g data-slot-index="2"><title>3 | 전처리 | 오류·중복·누락 등을 다루어 분석 가능한 상태로 만듦</title><rect x="32" y="227" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="252" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">3 | 전처리 | 오류·중복·누락 등을 다루어 분석 가능한 상태로 만듦</text></g><g data-slot-index="3"><title>4 | 분석 | 목적에 맞는 방법으로 데이터의 의미와 패턴을 찾음</title><rect x="32" y="311" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="336" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">4 | 분석 | 목적에 맞는 방법으로 데이터의 의미와 패턴을 찾음</text></g><g data-slot-index="4"><title>5 | 결과 해석 | 분석 결과를 문제와 맥락에 맞게 이해함</title><rect x="32" y="395" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="420" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">5 | 결과 해석 | 분석 결과를 문제와 맥락에 맞게 이해함</text></g><g data-slot-index="5"><title>6 | 의사결정 및 서비스 활용 | 결과를 실제 행동·판단·서비스에 연결함</title><rect x="32" y="479" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="504" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">6 | 의사결정 및 서비스 활용 | 결과를 실제 행동·판단·서비스에 연결함</text></g><path data-edge="0:1" d="M436 113 V140" stroke="#1F6F68" fill="none" marker-end="url(#arrow)"/><path data-edge="1:2" d="M436 197 V224" stroke="#1F6F68" fill="none" marker-end="url(#arrow)"/><path data-edge="2:3" d="M436 281 V308" stroke="#1F6F68" fill="none" marker-end="url(#arrow)"/><path data-edge="3:4" d="M436 365 V392" stroke="#1F6F68" fill="none" marker-end="url(#arrow)"/><path data-edge="4:5" d="M436 449 V476" stroke="#1F6F68" fill="none" marker-end="url(#arrow)"/></svg>