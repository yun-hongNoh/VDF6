<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="unspecified" viewBox="0 0 900 311" role="img" aria-label="여러 데이터의 결합과 가치 연결"><title>여러 데이터의 결합과 가치 연결</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="311" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">연결 관계 미지정 · 항목 원문 보존</text><g data-slot-index="0"><title>같은 서비스 안에서 여러 유형의 데이터가 함께 생성됨</title><rect x="32" y="59" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">같은 서비스 안에서 여러 유형의 데이터가 함께 생성됨</text></g><g data-slot-index="1"><title>목적에 맞는 데이터를 확보하고 신뢰할 수 있는 상태로 분석·결합함</title><rect x="32" y="143" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="168" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">목적에 맞는 데이터를 확보하고 신뢰할 수 있는 상태로 분석·결합함</text></g><g data-slot-index="2"><title>의미 있는 판단과 의사결정·서비스·운영 개선의 가치로 연결됨</title><rect x="32" y="227" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="252" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">의미 있는 판단과 의사결정·서비스·운영 개선의 가치로 연결됨</text></g></svg>