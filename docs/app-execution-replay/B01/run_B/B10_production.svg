<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 479" role="img" aria-label="빅데이터의 주요 활용 가치"><title>빅데이터의 주요 활용 가치</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="479" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">항목 배열</text><g data-slot-index="0"><title>이해 | 고객·학습자·시장·시스템의 현재 상태와 특성을 파악함</title><rect x="32" y="59" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">이해 | 고객·학습자·시장·시스템의 현재 상태와 특성을 파악함</text></g><g data-slot-index="1"><title>예측 | 과거와 현재 데이터로 수요·위험·행동·고장 가능성 등을 예측함</title><rect x="32" y="143" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="168" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">예측 | 과거와 현재 데이터로 수요·위험·행동·고장 가능성 등을 예측함</text></g><g data-slot-index="2"><title>의사결정 지원 | 여러 선택지 중 더 적절한 대안을 찾도록 도움을 줌</title><rect x="32" y="227" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="252" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">의사결정 지원 | 여러 선택지 중 더 적절한 대안을 찾도록 도움을 줌</text></g><g data-slot-index="3"><title>운영 효율화 | 생산·물류·재고·에너지·인력 등의 운영을 개선함</title><rect x="32" y="311" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="336" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">운영 효율화 | 생산·물류·재고·에너지·인력 등의 운영을 개선함</text></g><g data-slot-index="4"><title>새로운 서비스 | 추천·개인화·맞춤형 지원 등 데이터 기반 서비스를 제공함</title><rect x="32" y="395" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="420" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">새로운 서비스 | 추천·개인화·맞춤형 지원 등 데이터 기반 서비스를 제공함</text></g></svg>