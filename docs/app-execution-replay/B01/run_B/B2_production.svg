<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 359" role="img" aria-label="데이터와 정보의 차이"><title>데이터와 정보의 차이</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="359" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">항목 | A값 | B값</text><g data-slot-index="0"><title>성격 | 데이터: 사실이나 관찰 결과를 기록한 원자료 | 정보: 데이터를 목적에 맞게 정리·가공·분석하여 의미를 부여한 결과</title><rect x="32" y="59" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">성격 | 데이터: 사실이나 관찰 결과를 기록한 원자료 | 정보: 데이터를 목적에 맞게 </text><text x="46" y="107" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">정리·가공·분석하여 의미를 부여한 결과</text></g><g data-slot-index="1"><title>학습 사례 | 데이터: 강의 접속시간·학습시간·과제 제출 여부 | 정보: 여러 학생을 비교·분석해 학습참여가 낮은 학생을 파악한 결과</title><rect x="32" y="159" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="184" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">학습 사례 | 데이터: 강의 접속시간·학습시간·과제 제출 여부 | 정보: 여러 학생을 </text><text x="46" y="207" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">비교·분석해 학습참여가 낮은 학생을 파악한 결과</text></g><g data-slot-index="2"><title>활용 조건 | 데이터: 많이 보유하는 것만으로 충분하지 않음 | 정보: 발견한 의미를 실제 판단과 행동에 연결할 때 활용됨</title><rect x="32" y="259" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="284" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">활용 조건 | 데이터: 많이 보유하는 것만으로 충분하지 않음 | 정보: 발견한 의미를 </text><text x="46" y="307" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">실제 판단과 행동에 연결할 때 활용됨</text></g></svg>