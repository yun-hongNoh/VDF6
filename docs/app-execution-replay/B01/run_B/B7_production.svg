<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 259" role="img" aria-label="데이터 유형 판단 원칙"><title>데이터 유형 판단 원칙</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="259" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">항목 배열</text><g data-slot-index="0"><title>구조 기준 | 정형·반정형·비정형은 데이터의 구조적 특성을 설명하는 구분이며 실제 저장 형태를 확인해야 함</title><rect x="32" y="59" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">구조 기준 | 정형·반정형·비정형은 데이터의 구조적 특성을 설명하는 구분이며 실제 </text><text x="46" y="107" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">저장 형태를 확인해야 함</text></g><g data-slot-index="1"><title>가치 기준 | 어느 한 유형이 항상 더 가치 있는 것은 아니며 분석 목적·품질·접근 가능성·활용 방법에 따라 가치가 달라짐</title><rect x="32" y="159" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="184" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">가치 기준 | 어느 한 유형이 항상 더 가치 있는 것은 아니며 분석 목적·품질·접근 </text><text x="46" y="207" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">가능성·활용 방법에 따라 가치가 달라짐</text></g></svg>