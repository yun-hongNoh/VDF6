<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="unspecified" viewBox="0 0 900 479" role="img" aria-label="표본분포 적용 시나리오"><title>표본분포 적용 시나리오</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="479" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">연결 관계 미지정 · 항목 원문 보존</text><g data-slot-index="0"><title>약간 치우친 주간 학습시간 분포를 가진 재학생 모집단</title><rect x="32" y="59" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">약간 치우친 주간 학습시간 분포를 가진 재학생 모집단</text></g><g data-slot-index="1"><title>모집단에서 무작위로 표본을 뽑아 주간 학습시간 평균을 계산함</title><rect x="32" y="143" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="168" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">모집단에서 무작위로 표본을 뽑아 주간 학습시간 평균을 계산함</text></g><g data-slot-index="2"><title>100명 표본의 평균 계산을 50번 반복해 서로 다른 50개의 표본평균을 얻음</title><rect x="32" y="227" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="252" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">100명 표본의 평균 계산을 50번 반복해 서로 다른 50개의 표본평균을 얻음</text></g><g data-slot-index="3"><title>조건과 표본크기가 충분하면 표본평균의 분포가 정규분포에 가까워짐</title><rect x="32" y="311" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="336" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">조건과 표본크기가 충분하면 표본평균의 분포가 정규분포에 가까워짐</text></g><g data-slot-index="4"><title>표본크기를 20명에서 200명으로 늘리면 표준오차가 작아짐</title><rect x="32" y="395" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="420" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">표본크기를 20명에서 200명으로 늘리면 표준오차가 작아짐</text></g></svg>