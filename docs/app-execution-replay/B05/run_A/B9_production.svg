<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 343" role="img" aria-label="중심극한정리의 오개념"><title>중심극한정리의 오개념</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="343" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">항목 | A값 | B값</text><g data-slot-index="0"><title>정규분포에 가까워지는 대상 | 원자료가 항상 정규분포가 됨 | 주로 표본평균의 표본분포가 정규분포에 가까워짐</title><rect x="32" y="59" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">정규분포에 가까워지는 대상 | 원자료가 항상 정규분포가 됨 | 주로 표본평균의 </text><text x="46" y="107" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">표본분포가 정규분포에 가까워짐</text></g><g data-slot-index="1"><title>표본 확대의 효과 | 모든 편향이 사라짐 | 표준오차는 작아질 수 있으나 모든 편향이 사라지는 것은 아님</title><rect x="32" y="159" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="184" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">표본 확대의 효과 | 모든 편향이 사라짐 | 표준오차는 작아질 수 있으나 모든 편향이 </text><text x="46" y="207" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">사라지는 것은 아님</text></g><g data-slot-index="2"><title>정리의 초점 | 원자료 자체의 모양 | 표본평균의 표본분포</title><rect x="32" y="259" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="284" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">정리의 초점 | 원자료 자체의 모양 | 표본평균의 표본분포</text></g></svg>