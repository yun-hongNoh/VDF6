<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 243" role="img" aria-label="이산형과 연속형 확률분포"><title>이산형과 연속형 확률분포</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="243" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">항목 | A값 | B값</text><g data-slot-index="0"><title>값의 성격 | 이산형: 셀 수 있는 값을 가짐 | 연속형: 일정 구간의 연속적인 값을 가짐</title><rect x="32" y="59" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">값의 성격 | 이산형: 셀 수 있는 값을 가짐 | 연속형: 일정 구간의 연속적인 값을 가짐</text></g><g data-slot-index="1"><title>대표 사례 | 이산형: 불량품 개수·하루 방문자 수 | 연속형: 학습시간·키처럼 연속적으로 측정되는 값</title><rect x="32" y="143" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="168" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">대표 사례 | 이산형: 불량품 개수·하루 방문자 수 | 연속형: 학습시간·키처럼 </text><text x="46" y="191" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">연속적으로 측정되는 값</text></g></svg>