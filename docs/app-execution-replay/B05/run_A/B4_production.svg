<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 659" role="img" aria-label="대표적인 확률분포"><title>대표적인 확률분포</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="659" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">대분류 | 하위항목 목록</text><g data-slot-index="0"><title>이항분포 | 성공/실패의 두 결과·일정한 성공확률의 독립 시행 반복에서 성공횟수를 나타내는 이산분포 / 제품 20개 중 불량품 수·고객 10명 중 구매자 수</title><rect x="32" y="59" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">이항분포 | 성공/실패의 두 결과·일정한 성공확률의 독립 시행 반복에서 성공횟수를 </text><text x="46" y="107" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">나타내는 이산분포 / 제품 20개 중 불량품 수·고객 10명 중 구매자 수</text></g><g data-slot-index="1"><title>정규분포 | 평균 중심의 좌우 대칭 종 모양 연속분포 / 평균과 분산이 형태를 결정 / 통계적 추론의 기준분포</title><rect x="32" y="159" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="184" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">정규분포 | 평균 중심의 좌우 대칭 종 모양 연속분포 / 평균과 분산이 형태를 결정 / </text><text x="46" y="207" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">통계적 추론의 기준분포</text></g><g data-slot-index="2"><title>표준정규분포 | 평균 0·표준편차 1인 정규분포 / 서로 다른 정규분포의 값을 표준점수로 비교</title><rect x="32" y="259" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="284" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">표준정규분포 | 평균 0·표준편차 1인 정규분포 / 서로 다른 정규분포의 값을 </text><text x="46" y="307" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">표준점수로 비교</text></g><g data-slot-index="3"><title>t분포 | 모집단 분산을 모르고 표본이 비교적 작을 때 평균 추론에 활용 / 정규분포보다 꼬리가 두껍고 자유도가 커질수록 표준정규분포에 가까워짐</title><rect x="32" y="359" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="384" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">t분포 | 모집단 분산을 모르고 표본이 비교적 작을 때 평균 추론에 활용 / </text><text x="46" y="407" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">정규분포보다 꼬리가 두껍고 자유도가 커질수록 표준정규분포에 가까워짐</text></g><g data-slot-index="4"><title>카이제곱분포 | 0 이상의 값을 갖는 비대칭 분포 / 분산 추론과 범주형 자료의 적합도·독립성 검정에 활용 / 자유도에 따라 모양이 달라짐</title><rect x="32" y="459" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="484" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">카이제곱분포 | 0 이상의 값을 갖는 비대칭 분포 / 분산 추론과 범주형 자료의 </text><text x="46" y="507" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">적합도·독립성 검정에 활용 / 자유도에 따라 모양이 달라짐</text></g><g data-slot-index="5"><title>F분포 | 두 분산의 비와 관련된 양의 값의 분포 / 분산 비교와 분산분석에 활용 / 두 자유도가 형태를 결정</title><rect x="32" y="559" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="584" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">F분포 | 두 분산의 비와 관련된 양의 값의 분포 / 분산 비교와 분산분석에 활용 / 두 </text><text x="46" y="607" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">자유도가 형태를 결정</text></g></svg>