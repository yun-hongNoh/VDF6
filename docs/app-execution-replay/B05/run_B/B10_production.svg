<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 382" role="img" aria-label="중심극한정리 적용과 오개념 교정"><title>중심극한정리 적용과 오개념 교정</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="382" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">항목 | A값 | B값</text><g data-slot-index="0"><title>정규화 대상 | 오개념: 원자료가 항상 정규분포가 됨 | 바른 이해: 주로 표본평균의 표본분포가 정규분포에 가까워짐</title><rect x="32" y="59" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">정규화 대상 | 오개념: 원자료가 항상 정규분포가 됨 | 바른 이해: 주로 표본평균의 </text><text x="46" y="107" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">표본분포가 정규분포에 가까워짐</text></g><g data-slot-index="1"><title>표본크기 증가 | 오개념: 모든 편향이 사라짐 | 바른 이해: 표본평균의 표준오차가 일반적으로 작아짐</title><rect x="32" y="159" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="184" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">표본크기 증가 | 오개념: 모든 편향이 사라짐 | 바른 이해: 표본평균의 표준오차가 </text><text x="46" y="207" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">일반적으로 작아짐</text></g><g data-slot-index="2"><title>반복 표집 사례 | 조건: 재학생 중 무작위 표본의 주간 학습시간 평균을 50번 계산함 | 관찰: 50개 평균은 서로 달라질 수 있고 원자료가 다소 치우쳐도 표본평균 분포는 정규분포에 가까워질 수 있음</title><rect x="32" y="259" width="808" height="93" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="284" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">반복 표집 사례 | 조건: 재학생 중 무작위 표본의 주간 학습시간 평균을 50번 계산함 | </text><text x="46" y="307" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">관찰: 50개 평균은 서로 달라질 수 있고 원자료가 다소 치우쳐도 표본평균 분포는 </text><text x="46" y="330" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">정규분포에 가까워질 수 있음</text></g></svg>