<svg xmlns="http://www.w3.org/2000/svg" data-vdf-lossless="1" data-relation="rows" viewBox="0 0 900 579" role="img" aria-label="주요 세포 구성 요소"><title>주요 세포 구성 요소</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1F6F68"/></marker></defs><rect width="900" height="579" fill="#fff"/><text x="32" y="41" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">항목 배열</text><g data-slot-index="0"><title>세포막 | 세포를 환경으로부터 분리하고 세포 안팎으로 물질의 이동을 제어하는 지질 이중층</title><rect x="32" y="59" width="808" height="70" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="84" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">세포막 | 세포를 환경으로부터 분리하고 세포 안팎으로 물질의 이동을 제어하는 지질 </text><text x="46" y="107" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">이중층</text></g><g data-slot-index="1"><title>핵 | 세포의 제어 센터로 DNA를 보관함</title><rect x="32" y="159" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="184" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">핵 | 세포의 제어 센터로 DNA를 보관함</text></g><g data-slot-index="2"><title>미토콘드리아 | 세포 호흡을 통해 ATP를 생성함</title><rect x="32" y="243" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="268" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">미토콘드리아 | 세포 호흡을 통해 ATP를 생성함</text></g><g data-slot-index="3"><title>엽록체 | 식물에서 햇빛을 화학 에너지로 변환하는 광합성 장소</title><rect x="32" y="327" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="352" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">엽록체 | 식물에서 햇빛을 화학 에너지로 변환하는 광합성 장소</text></g><g data-slot-index="4"><title>소포체 | 단백질과 지질 합성에 관여함</title><rect x="32" y="411" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="436" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">소포체 | 단백질과 지질 합성에 관여함</text></g><g data-slot-index="5"><title>골지 장치 | 분비를 위해 단백질을 수정·분류·포장함</title><rect x="32" y="495" width="808" height="54" rx="10" fill="#f6f7f6" stroke="#1F6F68"/><text x="46" y="520" font-family="Malgun Gothic, sans-serif" font-size="15" fill="#212528" xml:space="preserve">골지 장치 | 분비를 위해 단백질을 수정·분류·포장함</text></g></svg>