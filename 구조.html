   '<p>왜 그림을 안 그렸는지 이유를 남긴다. 나중에 「여기는 왜 그림이 없지」 할 때 답이 된다.</p></div></div>';
  return $("#tree").innerHTML=h;
 }
 if(!T.gate)return $("#tree").innerHTML=h+'<p class="wait">위에서 하나를 고른다.</p>';

 h+='<div class="step"><div class="sn">4</div><div class="sb"><h3>화면 배치를 고른다</h3>'+
  '<p class="q">사물이 화면에 어떻게 놓이는가?</p><div class="cds">'+
  Object.keys(CARDS).map(k=>{
   const c=CARDS[k],ok=c.status==="verified"||c.status==="verified_after_fix";
   const bad=(k==="A"&&T.it==="분류·계층");
   return '<button class="cd'+(T.card===k?" on":"")+(ok?"":" dim")+(bad?" bad":"")+'" onclick="treeSet(\'card\',\''+k+'\')">'+
    ICONS[k]+'<span class="ct">'+k+' '+c.ko.split(" ·")[0]+'</span>'+
    '<span class="cs">'+(c.cap?"최대 "+c.cap+"개":"—")+(ok?"":" · 확인 안 됨")+'</span></button>';
  }).join("")+'</div>'+
  (T.it==="분류·계층"?'<p class="guard">항목이 두 무리로 묶여 있으면 A는 쓰지 않는다. 한 줄에 늘어놓으면 어느 게 어느 무리인지 사라진다.</p>':'')+
  '<p class="hint">흐린 것은 아직 충분히 확인되지 않은 배치다. 써도 되지만 결과를 꼭 눈으로 본다.</p></div></div>';

 if(T.card){
  const c=CARDS[T.card];
  h+='<div class="step"><div class="sn">5</div><div class="sb"><h3>문구를 덧붙인다</h3>'+
   '<p class="q">그릴 것의 성격에 따라 프롬프트에 문장이 붙는다</p>'+
   (c.frs.length?'<ul class="fr">'+c.frs.map(f=>'<li><code>'+esc(f.f)+'</code><span>'+esc(f.w||"")+'</span></li>').join("")+'</ul>'
    :'<p class="hint">이 배치에는 덧붙는 문구가 없다.</p>')+
   '<p class="hint">이 문장은 내가 쓰는 게 아니라 검사기가 붙인다.</p></div></div>';
  h+='<div class="step end"><div class="sn">끝</div><div class="sb"><h3>이 프롬프트가 나온다</h3>'+
   '<pre class="pr"><span class="k">subject:</span> '+esc(c.ex)+'\n'+
   '<span class="k">background:</span> '+esc(c.bg)+'\n'+
   '<span class="k">composition:</span> '+esc(c.cp)+'\n'+
   '<span class="k">style:</span> '+esc(c.st)+'\n'+
   '<span class="k">ratio:</span> 16:9\n'+
   '<span class="k">negative:</span> '+esc(c.ng)+'</pre>'+
   '<p class="hint">첫 줄만 덩어리마다 다르다. 나머지는 고정이다. '+esc(c.model)+'에서 만든다.</p></div></div>';
 }
 $("#tree").innerHTML=h;
}

const NODES={
 blk:{t:"덩어리",d:"본문을 나눈 한 토막. 대체로 슬라이드 한 장에 해당한다.",rel:["글은 반드시 있다","그림은 있을 수도, 없을 수도 있다"]},
 info:{t:"글",d:"항상 있다. 슬라이드의 텍스트가 된다. 그림이 없어도 슬라이드는 완성된다.",rel:["여섯 관계 중 하나를 가진다","슬라이드에 들어갈 문장을 만든다"]},
 bg:{t:"그림",d:"없을 수 있다. 그릴 것이 하나로 정해진 덩어리만 가진다. 예시 열한 덩어리 중 둘이었다.",rel:["화면 배치를 하나 고른다","그릴 것을 하나 가진다"]},
 it:{t:"항목들의 관계",d:"순서·절차 / 분류·계층 / 비교·대조 / 인과·수렴 / 정의 / 목록. 이 여섯 개 안에서만 고른다.",rel:["문장을 어떤 형식으로 쓸지 정한다","어떤 배치를 못 쓰는지 정한다 — 두 무리로 묶이면 A 금지"]},
 card:{t:"화면 배치 A~F",d:"사물이 화면에 어떻게 놓이는가. 프롬프트 여섯 줄 중 다섯 줄이 배치마다 고정돼 있다.",rel:["한 장에 그릴 개수가 정해져 있다","어느 도구에서 만들지가 정해져 있다","덧붙는 문구 목록을 가진다"]},
 sub:{t:"그릴 것",d:"성격 다섯 가지를 가진다 — 브랜드가 연상되는 물건인가 / 같은 사물의 여러 모습인가 / 무언가를 바꾼 것인가 / 크기 변화가 핵심인가 / 화면 전체에 퍼지는가.",rel:["덧붙는 문구를 발동시킨다","GPT는 성격만 적고 문구는 쓰지 않는다"]},
 frag:{t:"덧붙는 문구",d:"그릴 것의 성격에 따라 프롬프트에 들어가거나 빠지는 문장. 판단은 GPT가, 붙이는 건 검사기가 한다.",rel:["그릴 것의 성격이 발동시킨다","배치마다 목록이 다르다"]}
};
function node(k){
 const n=NODES[k];
 document.querySelectorAll("#graph .gn").forEach(x=>x.classList.toggle("sel",x.dataset.k===k));
 $("#ginfo").innerHTML='<h3>'+esc(n.t)+'</h3><p>'+esc(n.d)+'</p><ul>'+n.rel.map(r=>'<li>'+esc(r)+'</li>').join("")+'</ul>';
}

pick("gpt");drawTree();node("blk");
